{% extends 'base.html' %}
{% load static %}

{% block title %}Nueva Reserva | ReserVa{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/formularios.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    
    <!-- Botón Volver -->
    <a href="{% url 'inicio' %}" class="back-button">
        <span class="arrow">←</span> Volver al Inicio
    </a>
    
    <!-- Tarjeta de Reserva -->
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">Reservar Mesa</h2>
            <p class="auth-subtitle">Completa los detalles para asegurar tu experiencia</p>
        </div>

        <form method="POST" action="{% url 'crear_reserva' %}" class="auth-form">
            {% csrf_token %}

            <!-- DATOS PERSONALES -->
            <div class="form-group">
                <label for="nombre" class="form-label">Nombre</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    class="form-input" 
                    placeholder="Escribe tu nombre" 
                    required
                />
            </div>

            <div class="form-group">
                <label for="telefono" class="form-label">Teléfono</label>
                <input 
                    type="text" 
                    id="telefono" 
                    name="telefono" 
                    class="form-input" 
                    placeholder="3177373170" 
                    required
                />
            </div>

            <!-- CANTIDAD DE PERSONAS -->
            <div class="form-group">
                <label for="cantidad_personas" class="form-label">Personas</label>
                <input 
                    type="number" 
                    id="cantidad_personas" 
                    name="cantidad_personas" 
                    class="form-input" 
                    min="1" 
                    placeholder="Ej: 4"
                    required
                />
            </div>

            <!-- MESA -->
            <div class="form-group">
                <label for="mesa" class="form-label">Mesa</label>
                <input 
                    type="text" 
                    id="mesa" 
                    name="mesa" 
                    class="form-input" 
                    placeholder="M1, M2..." 
                    required
                />
            </div>

            <!-- FECHA Y HORA EN LA MISMA FILA -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input 
                        type="date" 
                        id="fecha" 
                        name="fecha" 
                        class="form-input" 
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="hora" class="form-label">Hora</label>
                    <input 
                        type="time" 
                        id="hora" 
                        name="hora" 
                        class="form-input" 
                        required
                    />
                </div>
            </div>

            <!-- NOTAS -->
            <div class="form-group">
                <label for="notas" class="form-label">Notas <span style="color: var(--form-text-secondary); font-weight: 400;">(Opcional)</span></label>
                <textarea 
                    id="notas" 
                    name="notas" 
                    class="form-input" 
                    rows="3" 
                    placeholder="Ej: Alergias, mesa cerca a la ventana..."
                ></textarea>
            </div>

            <!-- PREORDENAR -->
            <div class="form-group">
                <label for="preordenar" class="form-label">¿Desea preordenar sus platos de una vez?</label>
                <select 
                    name="preordenar" 
                    id="preordenar" 
                    class="form-input"
                >
                    <option value="NO">No, solo reservar la mesa</option>
                    <option value="SI">Sí, elegir los platos ahora</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">
                Confirmar Reserva
            </button>

        </form>
    </div>
</div>
{% endblock %}
